<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <title>One Piece</title>
</head>
<body>
    <div class="container">
        <h1>One Voyage</h1>

        <form action="/enviar" method="POST">

            <div>
                <p id="P">NOME COMPLETO</p>
                <input type="text" autocomplete="off" name="NOME" class="input" placeholder="Nome completo" required>
            </div>

            <div>
                <p>E-MAIL</p>
                <input type="email" autocomplete="off" name="E-MAIL" class="input" placeholder="Adicione seu email" required>
            </div>

            <div>
                <p>SENHA</p>
                <input type="password" autocomplete="off" name="senha" class="input" placeholder="Digite uma Senha" required>
            </div>

            <button type="submit">Registre-se</button>

            <div class="social">
                <a href="#"><img src="icons/google.png" alt="Google"></a>
                <a href="#"><img src="icons/facebook.png" alt="Facebook"></a>
                <a href="#"><img src="icons/apple.png" alt="Apple"></a>
            </div>
        </form>

    </div>

    <div class="container_2">

        <h2>Já faz parte da tripulação?</h2>

       <a href="#" class="#">entrar</a>
        
    </div>


</body>
</html>
